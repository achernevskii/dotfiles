---
- name: "Fail on unsupported OS families"
  ansible.builtin.fail:
    msg: "The fail2ban role supports only the RedHat OS family, not {{ ansible_facts['os_family'] }}."
  when: ansible_facts['os_family'] != 'RedHat'

- name: Include RedHat installation tasks
  include_tasks: install-redhat.yaml
  when: ansible_os_family == 'RedHat'

- name: "Configure the sshd jail"
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (fail2ban role).
      # backend = systemd because Fedora logs sshd to the journal, not
      # /var/log/secure.
      [sshd]
      enabled  = true
      backend  = systemd
      # Ban after this many failed attempts within findtime.
      maxretry = 4
      # Sliding window in which the failures must occur.
      findtime = 1h
      # Base ban duration for a first offence.
      bantime  = 30m
      # Escalate bantime for repeat offenders (persisted in the DB).
      bantime.increment = true
      # Add 0-5m of random jitter so ban expiry isn't predictable.
      bantime.rndtime = 5m
  become: true
  notify: Restart fail2ban

- name: "Enable and start fail2ban"
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
  become: true
