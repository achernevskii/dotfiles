---
- name: "Refuse to run on unsupported systems"
  ansible.builtin.fail:
    msg: >-
      user_facts supports Linux and macOS, {{ inventory_hostname }} is
      {{ ansible_facts.system }}.
  when: ansible_facts.system not in ['Linux', 'Darwin']

- include_tasks: lookup-linux.yaml
  when: ansible_facts.system == 'Linux'

- include_tasks: lookup-darwin.yaml
  when: ansible_facts.system == 'Darwin'

- name: "Collect the facts about {{ user_login }}"
  ansible.builtin.set_fact:
    user: >-
      {{ {'login': user_login, 'fullname': user_fullname}
         | combine(user_facts_lookup) }}
