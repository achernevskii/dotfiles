---
- name: "Look up {{ user_login }} in the passwd database"
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_login }}"
  become: false

# Keyed by gid, so the result is keyed by the group's name.
- name: "Look up the primary group of {{ user_login }}"
  ansible.builtin.getent:
    database: group
    key: "{{ ansible_facts.getent_passwd[user_login][2] }}"
  become: false

# getent_passwd fields: password, uid, gid, gecos, home, shell.
- name: "Store the account details of {{ user_login }}"
  ansible.builtin.set_fact:
    user_facts_lookup:
      uid: "{{ ansible_facts.getent_passwd[user_login][1] | int }}"
      gid: "{{ ansible_facts.getent_passwd[user_login][2] | int }}"
      group: "{{ ansible_facts.getent_group.keys() | first }}"
      home: "{{ ansible_facts.getent_passwd[user_login][4] }}"
      shell: "{{ ansible_facts.getent_passwd[user_login][5] }}"
